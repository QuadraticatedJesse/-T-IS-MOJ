<body>

    <div class="honeycomb-container">
        <!-- ROW 0 -->

            <div class="hexagon" id="hex-4"><span>4</span></div>
            <div class="hexagon" id="hex-5"><span>5</span></div>
        </div>

        <!-- ROW 2 (Offset row) -->
        <div class="honeycomb-row offset-row push-left-2">
            <a href=""><div class="hexagon" id="hex-6"><span>6</span></div></a>

        </div>

        <!-- ROW 4 -->
        <div class="honeycomb-row offset-row">

    <footer>
        <p class="whitetext">&copy; 2026 | <a href="mailto:136658@stanislascollege.net" class="orangetext">Jesse van 't Veer </a> & <a href="mailto:136865@stanislascollege.net" class="orangetext"> Tijn Geurtzen</a></p>
    </footer>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const previewImage = '/images/hexagon.png';
        const hoverDelayMs = 500;
        let hoverTimer = null;
        let activePreview = null;
        let currentHex = null;

        const cancelPreview = () => {
          if (hoverTimer) {
            clearTimeout(hoverTimer);
            hoverTimer = null;
          }
          if (activePreview) {
            activePreview.remove();
            activePreview = null;
          }
        };

        const showPreview = (hex) => {
          cancelPreview();
          const rect = hex.getBoundingClientRect();
          const preview = document.createElement('div');
          preview.className = 'hex-preview';
          preview.style.top = `${window.scrollY + rect.top - 220}px`;
          preview.style.left = `${window.scrollX + rect.left + rect.width / 2}px`;

          const image = document.createElement('img');
          image.src = previewImage;
          image.alt = `Preview image for ${hex.id || 'page'}`;
          image.className = 'previewFlyinPageImage';

          const label = document.createElement('div');
          label.className = 'preview-label';
          label.textContent = hex.dataset.previewTitle || 'Page Preview';

          preview.appendChild(image);
          preview.appendChild(label);
          document.body.appendChild(preview);
          activePreview = preview;
        };

        document.querySelectorAll('.hexagon').forEach((hex) => {
          if (hex.classList.contains('invisible')) return;
          hex.dataset.previewTitle = `Preview for ${hex.id || 'page'}`;
          hex.addEventListener('mouseenter', () => {
            currentHex = hex;
            hoverTimer = window.setTimeout(() => {
              if (currentHex === hex) showPreview(hex);
            }, hoverDelayMs);
          });
          hex.addEventListener('mouseleave', cancelPreview);
          hex.addEventListener('mousedown', cancelPreview);
        });

        window.addEventListener('scroll', cancelPreview);
      });
    </script>
</body>
</html>
