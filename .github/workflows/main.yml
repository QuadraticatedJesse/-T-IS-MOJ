# .github/workflows/main.yml

name: Build and Deploy to Azure

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Lint and test the application
      - name: Lint and Test
        run: |
          npm run lint
          npm test

      # Step 5: Login via Azure CLI
      - name: Login via Azure CLI
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 6: Build and push image to ACR
      - name: Build and push image to ACR
        run: |
          az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/nodejs-app:${{ github.sha }} .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/nodejs-app:${{ github.sha }}

      # Step 7: Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: '${{ secrets.ACR_LOGIN_SERVER }}/nodejs-app:${{ github.sha }}'